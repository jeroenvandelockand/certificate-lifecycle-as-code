apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-app-nginx
  namespace: demo-app
data:
  default.conf: |
    server {
      listen 8443 ssl;
      server_name demo.apps.demo.internal;

      ssl_certificate /etc/tls/tls.crt;
      ssl_certificate_key /etc/tls/tls.key;
      ssl_protocols TLSv1.2 TLSv1.3;

      location / {
        default_type text/plain;
        return 200 "Certificate Lifecycle as Code\n";
      }
    }

